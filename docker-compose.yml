x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
  DEBUG: ${DJANGO_DEBUG:-True}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
  DB_NAME: ${DB_NAME:-shop_db}
  DB_USER: ${DB_USER:-shop_user}
  DB_PASSWORD: ${DB_PASSWORD:-strong_password}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  ORDER_PAYMENT_TIMEOUT_MINUTES: ${ORDER_PAYMENT_TIMEOUT_MINUTES:-30}
  ORDER_EXPIRY_CHECK_MINUTES: ${ORDER_EXPIRY_CHECK_MINUTES:-5}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  # EMAIL_USE_SSL / EMAIL_USE_TLS are derived from EMAIL_PORT in settings.py
  # (465 -> SSL, otherwise TLS). Add them here only if you need to override.
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@fashionshop.kz}
  USE_S3: ${USE_S3:-True}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  AWS_STORAGE_BUCKET_NAME: ${MINIO_BUCKET:-shop-media}
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_CUSTOM_DOMAIN: ${MINIO_PUBLIC_DOMAIN:-localhost:9000/shop-media}
  AWS_S3_URL_PROTOCOL: ${MINIO_PUBLIC_PROTOCOL:-http:}
  AWS_S3_ADDRESSING_STYLE: path
  AWS_QUERYSTRING_AUTH: ${AWS_QUERYSTRING_AUTH:-False}
  FREEDOMPAY_MERCHANT_ID: ${FREEDOMPAY_MERCHANT_ID:-}
  FREEDOMPAY_SECRET_KEY: ${FREEDOMPAY_SECRET_KEY:-}
  FREEDOMPAY_API_URL: ${FREEDOMPAY_API_URL:-https://api.freedompay.kz}
  FREEDOMPAY_TESTING_MODE: ${FREEDOMPAY_TESTING_MODE:-1}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: 1
      RUN_COLLECTSTATIC: 1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  celery:
    build: .
    command: celery -A config worker -l info
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    volumes:
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A config beat -l info
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shop_db}
      POSTGRES_USER: ${DB_USER:-shop_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-shop-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set download local/$${MINIO_BUCKET};
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_volume:
  media_volume:
